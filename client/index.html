<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CoDraw | Real-Time Collaborative Canvas</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- App Container -->
  <div id="app">
    
    <!-- Top Navigation Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand">
          <span class="brand-icon">🎨</span>
          <span class="brand-name">CoDraw<span class="brand-tag">LIVE</span></span>
        </div>

        <div class="room-box">
          <span class="room-label">ROOM:</span>
          <input type="text" id="room-input" value="main" title="Enter room name and press Enter to switch">
          <button id="btn-copy-room" class="btn-icon" title="Copy Room Share Link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          </button>
        </div>
      </div>

      <div class="header-center">
        <!-- Online Users Avatars -->
        <div class="users-container">
          <span class="users-label">Online (<span id="user-count">1</span>):</span>
          <div id="users-avatars" class="avatars-list">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <div class="header-right">
        <!-- Performance Metrics -->
        <div class="metrics-badge">
          <div class="metric-item" title="Frames Per Second">
            <span class="metric-val" id="val-fps">60</span>
            <span class="metric-unit">FPS</span>
          </div>
          <div class="metric-divider"></div>
          <div class="metric-item" title="Network Ping Latency">
            <span class="metric-val" id="val-latency">--</span>
            <span class="metric-unit">ms</span>
          </div>
        </div>

        <!-- Connection Status -->
        <div id="connection-badge" class="status-badge connecting">
          <span class="status-dot"></span>
          <span id="status-text">Connecting...</span>
        </div>

        <!-- User Self Profile -->
        <div id="self-profile" class="self-badge" title="Your User Identity">
          <span id="self-color-indicator" class="user-color-dot"></span>
          <span id="self-name">Anonymous</span>
        </div>
      </div>
    </header>

    <!-- Main Canvas Viewport Area -->
    <main class="canvas-viewport">
      <!-- Multi-Layer Canvas Stacks -->
      <div id="canvas-container">
        <!-- Layer 1: Static background grid & finalized drawings -->
        <canvas id="main-canvas"></canvas>
        <!-- Layer 2: Live in-flight local & remote stroke drawings -->
        <canvas id="active-canvas"></canvas>
        <!-- Layer 3: Remote user cursors & stroke hover indicators -->
        <div id="cursor-overlay"></div>
      </div>

      <!-- Floating Toolbar Panel -->
      <nav class="floating-toolbar">
        
        <!-- Tools Group -->
        <div class="toolbar-section">
          <button class="tool-btn active" data-tool="brush" title="Brush (B)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11l-5-5L3 16v5h5l10-10z"></path><path d="M14 6l4 4"></path></svg>
            <span class="tool-label">Brush</span>
          </button>
          <button class="tool-btn" data-tool="eraser" title="Eraser (E)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2C14 1 16 1 17 2L21 6C22 7 22 9 21 10L12 19"></path></svg>
            <span class="tool-label">Eraser</span>
          </button>
          <button class="tool-btn" data-tool="line" title="Line (L)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"></line></svg>
            <span class="tool-label">Line</span>
          </button>
          <button class="tool-btn" data-tool="rectangle" title="Rectangle (R)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
            <span class="tool-label">Rect</span>
          </button>
          <button class="tool-btn" data-tool="circle" title="Circle (C)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg>
            <span class="tool-label">Circle</span>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Colors Group -->
        <div class="toolbar-section colors-section">
          <div class="color-swatches">
            <button class="swatch active" data-color="#000000" style="background: #000000;"></button>
            <button class="swatch" data-color="#FFFFFF" style="background: #FFFFFF;"></button>
            <button class="swatch" data-color="#FF3B30" style="background: #FF3B30;"></button>
            <button class="swatch" data-color="#FF9500" style="background: #FF9500;"></button>
            <button class="swatch" data-color="#FFCC00" style="background: #FFCC00;"></button>
            <button class="swatch" data-color="#34C759" style="background: #34C759;"></button>
            <button class="swatch" data-color="#007AFF" style="background: #007AFF;"></button>
            <button class="swatch" data-color="#AF52DE" style="background: #AF52DE;"></button>
          </div>
          <div class="custom-color-picker" title="Custom Color">
            <input type="color" id="custom-color" value="#000000">
            <span class="picker-preview" id="picker-preview"></span>
          </div>
        </div>

        <div class="toolbar-divider"></div>

        <!-- Stroke Width Control -->
        <div class="toolbar-section stroke-section">
          <div class="stroke-preview-container" title="Stroke Width">
            <div id="stroke-preview-dot"></div>
          </div>
          <input type="range" id="stroke-width" min="1" max="50" value="5" title="Adjust Stroke Width">
          <span id="stroke-val">5px</span>
        </div>

        <div class="toolbar-divider"></div>

        <!-- History & Actions Group -->
        <div class="toolbar-section actions-section">
          <button id="btn-undo" class="action-btn" title="Undo (Ctrl+Z)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
          </button>
          <button id="btn-redo" class="action-btn" title="Redo (Ctrl+Y)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
          </button>
          <button id="btn-clear" class="action-btn danger" title="Clear Canvas">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>

          <div class="dropdown-container">
            <button id="btn-export" class="action-btn primary" title="Export Options">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              <span>Export</span>
            </button>
            <div id="export-menu" class="dropdown-menu">
              <button id="export-png" class="dropdown-item">
                <span>PNG Image</span>
              </button>
              <button id="export-svg" class="dropdown-item">
                <span>SVG Vector</span>
              </button>
              <button id="export-json" class="dropdown-item">
                <span>JSON History</span>
              </button>
            </div>
          </div>
        </div>

      </nav>
    </main>

    <!-- Toast Notification Banner -->
    <div id="toast-container"></div>
  </div>

  <script src="websocket.js"></script>
  <script src="canvas.js"></script>
  <script src="main.js"></script>
</body>
</html>
